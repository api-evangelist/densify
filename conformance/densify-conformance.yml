domain_standards:
  market: cloud cost / Kubernetes resource optimization (FinOps)
  candidate_standard: FOCUS 1.3 (FinOps Open Cost and Usage Specification)
  declared_in_contract: false
  evidence: >-
    No FOCUS column names, no billing/cost-export endpoint and no FOCUS schema reference appear
    in any of the 21 specs. Kubex reads cloud billing data as an input and emits optimization

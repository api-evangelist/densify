source: live GET probes of /.well-known/* on every host this record knows
note: >-
  Densify trades as Kubex; www.densify.com, portal.densify.com, api.densify.com and
  kubex.ai are all served by the same WordPress edge, which answers a styled HTML 404 for
  every unknown path — none of those 404s is a document. The only host serving real
  /.well-known/ documents is the documentation host docs.kubex.ai (Mintlify), which
  publishes an A2A agent card, an MCP discovery manifest and an Agent Skill. No security.txt,
  no OpenID/OAuth metadata and no api-catalog is served anywhere.

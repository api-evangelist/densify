apis:
- aid: densify:public-cloud-api
  name: Kubex (Densify) Public Cloud API
  description: The Kubex (formerly Densify) Public Cloud REST API onboards AWS accounts, Azure subscriptions
    and GCP projects for machine-learning optimization analysis and returns right-sizing recommendations
    for EC2/RDS/ASG, Azure VM and VM Scale Set, and GCE resources. It also covers the system inventory,
    catalog map, analysis webhooks and the customizable Subscriptions surface (properties, tags, suppressions,
    results and status). JSON over HTTPS under /api/v2, authenticated with a 60-minute JWT bearer token
    obtained from POST /authorize. Recommendation endpoints content-negotiate to application/terraform-map
    for direct consumption by infrastructure-as-code.

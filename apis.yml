- aid: densify:container-api
  name: Kubex (Densify) Container Optimization API
  description: 'The Kubex (formerly Densify) Container Optimization REST API returns machine-learned right-sizing
    recommendations for Kubernetes container manifests across EKS, AKS, GKE, OKE, OpenShift, NKP, RKE2,
    K3S and self-managed clusters. It lists the clusters Kubex is collecting from, walks the namespace/pod/container
    tree for one cluster, and returns recommended CPU and memory requests and limits — with a detailed
    representation that adds predicted uptime, OOM-kill counts over the last seven days, node group and
    audit history. Read-only with respect to the cluster: changes are applied by the in-cluster Kubex
    Automation Engine under its own policy CRDs.'
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg

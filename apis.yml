- aid: densify:container-api
  name: Densify Container Optimization API
  description: >-
    The Densify Container Optimization REST API provides programmatic access to container right-sizing
    recommendations across Amazon EKS, AKS, GKE, OpenShift, and self-managed Kubernetes footprints. It
    exposes endpoints for clusters, namespaces, controllers, container groups, and recommended requests/limits
    for CPU and memory based on machine learned utilization patterns.

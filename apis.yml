aid: densify
name: Densify
description: Densify — now trading as Kubex — provides a machine-learning driven cloud, GPU and container
  optimization platform that continuously right-sizes resources to cut cost and protect performance across
  Kubernetes, public cloud and GPU/AI infrastructure. The Kubex REST API publishes 65 operations across
  21 first-party OpenAPI documents covering cloud account onboarding and analysis, AWS/Azure/GCP right-sizing
  recommendations, Kubernetes cluster and container recommendations, the system inventory, analysis webhooks
  and a customizable Subscriptions surface, so optimization can be embedded into CI/CD pipelines, Terraform
  and other infrastructure-as-code, and FinOps workflows. Kubex also ships a per-tenant Model Context
  Protocol server and publishes an A2A agent card and an Agent Skill from its documentation host.

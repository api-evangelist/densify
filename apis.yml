apis:
- aid: densify:public-cloud-api
  name: Densify Public Cloud API
  description: >-
    The Densify Public Cloud REST API exposes optimization analysis, recommendations, account and instance
    inventory, and systems data for AWS, Azure, and Google Cloud environments. The API uses JSON over
    HTTPS, follows a resource-oriented design under the /api/v2/ path, and authenticates with JWT bearer
    tokens obtained from the /authorize endpoint. Common use cases include integrating right-sizing recommendations
    into Terraform, CloudFormation, and CI/CD pipelines.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
